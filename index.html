const to=setTimeout(()=>lock('連線逾時，請確認已登入 Claude 後重新整理。'),15000);USER=await claude.use('user');DB=await claude.use('db');clearTimeout(to);
if(!USER||!DB){lock('請先登入 Claude 帳號，並請管理員把這個 App 分享給您。');return}
ME=await USER.id();const own=await USER.isOwner();const st=await DB.collection('staff').get();STAFF={};st.docs.forEach(d=>STAFF[d.id]=d.data());
ROLE=own?'admin':(ME&&STAFF[ME]&&STAFF[ME].role)||null;
if(!ROLE){lock('您的帳號尚未開通。請把下方代碼交給管理員，由管理員在「報表→帳號管理」加入。',ME||'（無法取得代碼）');return}
CANW=(await USER.can('data.write'))!==false;await pull();V=ROLE=='admin'?'home':'list';$('nav').style.display='';render();
if(!CANW)toast('目前是唯讀權限')}catch(e){lock('載入失敗，請重新整理。'+((e&&e.code)?'（'+e.code+'）':''))}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DB&&ROLE&&!WQ&&V!='add'){pull().then(render).catch(()=>{})}});
const nn=x=>{if(typeof x=='number')return x;const v=parseFloat(String(x).replace(/[,\s$]/g,''));return isFinite(v)?v:null};
function xd(v){if(typeof v=='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);if(typeof v=='string'){const m=v.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(m)return m[1]+'-'+z(+m[2])+'-'+z(+m[3])}return null}
function parseWB(wb){const R=[],E=[],nv=new Set();
for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});let hi=-1;
for(let i=0;i<Math.min(rows.length,20);i++){const t=rows[i].map(String);if(t.some(x=>/日期/.test(x))&&t.some(x=>/早|晚|金額|數量|單價/.test(x))){hi=i;break}}
if(hi<0)continue;const M={};rows[hi].forEach((c,j)=>{c=String(c).trim();if(!c)return;const k=/日期/.test(c)?'d':/廠商|供應商/.test(c)?'v':/編號/.test(c)?'c':/單號/.test(c)?'no':/數量/.test(c)?'q':/單價/.test(c)?'p':/金額|小計/.test(c)?'t':/^早/.test(c)?'m':/^晚/.test(c)?'n':/備註/.test(c)?'k':/規格/.test(c)?'s':/^品項|^品名/.test(c)?'i':null;if(k&&M[k]==null)M[k]=j});
if(M.i==null&&M.s!=null){M.i=M.s;M.s=null}
const nm=sn.replace(/^\d{4}[-年]?/,'').trim(),vd=M.v==null?(Object.keys(D.ven).find(k=>k==nm||k.includes(nm)||nm.includes(k))||nm):null,gs=(r,k)=>M[k]!=null?String(r[M[k]]==null?'':r[M[k]]).trim():'';
for(let i=hi+1;i<rows.length;i++){const r=rows[i],d=xd(r[M.d]);if(!d)continue;
if(M.m!=null||M.n!=null){const a=nn(r[M.m]),b=nn(r[M.n]);if(a!=null||b!=null)R.push([d,a||0,b||0,gs(r,'k')])}
else{const q=nn(r[M.q]),p=nn(r[M.p]);let t=nn(r[M.t]);if(t==null&&q!=null&&p!=null)t=q*p;if(!(t>0))continue;const v=M.v!=null?gs(r,'v'):vd;if(!v)continue;if(!D.ven[v])nv.add(v);E.push({d:d,v:v,i:gs(r,'i')||v,q:q==null?'':q,p:p==null?'':p,t:+t.toFixed(2),k:gs(r,'k'),c:gs(r,'c'),s:gs(r,'s'),no:gs(r,'no')})}}}
return{rev:R,exp:E,nv:[...nv]}}
function impf(el){const fl=el.files[0];if(!fl)return;if(!window.XLSX){toast('Excel 元件載入失敗，請重新整理');return}const r=new FileReader();r.onload=()=>{try{IMP=parseWB(XLSX.read(r.result,{type:'array'}));if(!IMP.rev.length&&!IMP.exp.length){IMP=null;toast('找不到可匯入的資料，請確認欄位標題')}render()}catch(e){IMP=null;toast('無法讀取這個檔案')}};r.readAsArrayBuffer(fl)}
function impok(){const I=IMP,key=e=>[e.d,e.v,e.i,e.q,e.t,e.no].join('|'),ex=new Set(D.exp.map(key));let a=0,id=Date.now();
I.rev.forEach(([d,m,n,k])=>{D.rev[d]={m:m,n:n,k:k}});
I.exp.forEach(e=>{if(!D.ven[e.v])D.ven[e.v]={c:'其他',i:[]};const it=D.ven[e.v].i.find(x=>x.n==e.i);if(!it)D.ven[e.v].i.push({n:e.i,u:'',p:e.p===''?0:e.p,c:e.c,s:e.s});else{if(!it.c&&e.c)it.c=e.c;if(!it.s&&e.s)it.s=e.s}e.id=id++;if(!ex.has(key(e))){D.exp.push(e);ex.add(key(e));a++}});
IMP=null;save();toast('已匯入營收 '+I.rev.length+' 天、進貨 '+a+' 筆');render()}
async function stfSet(id,role){try{await DB.doc('staff/'+id).set({role:role});STAFF[id]={role:role};toast('已更新');render()}catch(e){toast('無法更新：'+((e&&e.code)||'權限不足'))}}
async function stfDel(id){try{await DB.doc('staff/'+id).delete();delete STAFF[id];toast('已移除');render()}catch(e){toast('無法移除')}}
async function usr(q){const r=await USER.search(q);$('ures').innerHTML=r.length?r.map(p=>`<div class="row"><span>${esc(p.name||'未命名')}</span><span><button class="x" style="color:var(--ac)" data-id="${esc(p.id)}" onclick="stfSet(this.dataset.id,'staff')">加為員工</button><button class="x" style="color:var(--ac)" data-id="${esc(p.id)}" onclick="stfSet(this.dataset.id,'admin')">加為管理員</button></span></div>`).join(''):'<p class="mu">找不到。對方需要先被分享這個 App。</p>'}
async function fnames(){const els=[...document.querySelectorAll('[data-nm]')],ids=els.map(e=>e.dataset.nm);if(!ids.length)return;const ps=await USER.profiles(ids);els.forEach(e=>e.textContent=(ps[e.dataset.nm]&&ps[e.dataset.nm].name)||'未命名使用者')}
function admCardsOld(){const ids=Object.keys(STAFF);
const pv=IMP?`<div class="c"><h3>匯入預覽</h3><p>營收 ${IMP.rev.length} 天、進貨／支出 ${IMP.exp.length} 筆（合計 ${f(IMP.exp.reduce((a,e)=>a+e.t,0))}）${IMP.nv.length?'<br>將新增廠商：'+IMP.nv.map(esc).join('、'):''}</p><small class="mu">相同日期的營收會被覆蓋；完全重複的進貨會略過。</small><button class="btn" onclick="impok()">確認匯入</button><button class="bt2" onclick="IMP=null;render()">取消</button></div>`:'';
return `<div class="c"><h3>匯入 Excel</h3><p class="mu">每列一筆。營收檔標題需有：日期、早、晚、備註。進貨檔標題需有：日期、廠商、品項、產品編號、品名規格、數量、單價、含稅金額、單號；沒有「廠商」欄時，會用分頁名稱當廠商。</p><input type="file" accept=".xlsx,.xls,.csv" onchange="impf(this)"></div>${pv}
<div class="c"><h3>帳號管理</h3><p class="mu">目前登入：<span data-nm="${esc(ME)}">…</span>（${ROLE=='admin'?'管理員':'員工'}）。員工只能使用明細、記帳、廠商；管理員可看總覽、報表、匯入與帳號管理。</p>${ids.map(id=>`<div class="row" style="align-items:center"><span data-nm="${esc(id)}">載入中</span><span class="pr"><select data-id="${esc(id)}" style="width:auto;margin:0;padding:6px" onchange="stfSet(this.dataset.id,this.value)"><option value="admin"${STAFF[id].role=='admin'?' selected':''}>管理員</option><option value="staff"${STAFF[id].role!='admin'?' selected':''}>員工</option></select><button class="x" data-id="${esc(id)}" onclick="two(this,()=>stfDel(this.dataset.id))">移除</button></span></div>`).join('')||'<p class="mu">還沒有其他使用者。</p>'}
<label style="margin-top:12px">搜尋同事並加入<input placeholder="輸入姓名後按 Enter" onchange="usr(this.value)"></label><div id="ures"></div><small class="mu">對方要先被分享這個 App（可互動以上），才搜尋得到。</small></div>`}
let ACC={},SES=null,CANA=false,FAIL=0,FT0=0;
const enc=new TextEncoder(),hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),aid=n=>hx(enc.encode(n.trim().toLowerCase())),rsalt=()=>hx(crypto.getRandomValues(new Uint8Array(16)));
async function hpw(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
async function boot(){$('nav').style.display='none';$('app').innerHTML='<p class="mu" style="text-align:center;margin-top:60px">載入中…</p>';
try{if(!window.claude||!claude.use){lock('請在 Claude 內開啟此 App。');return}
const to=setTimeout(()=>lock('連線逾時，請重新整理。'),15000);USER=await claude.use('user');DB=await claude.use('db');clearTimeout(to);
if(!USER||!DB){lock('請先登入 Claude，並請管理員把這個 App 分享給您。');return}
CANW=(await USER.can('data.write'))!==false;CANA=await USER.canEdit();
const a=await DB.collection('accounts').get();ACC={};a.docs.forEach(d=>ACC[d.id]=d.data());
let s=null;try{s=sessionStorage.getItem('rs')}catch(e){}
if(s&&ACC[s]){SES=s;await enter();return}loginUI()}catch(e){lock('載入失敗，請重新整理。'+((e&&e.code)?'（'+e.code+'）':''))}}
function loginUI(){$('nav').style.display='none';$('hbk').innerHTML='';$('hus').innerHTML='';const none=!Object.keys(ACC).length;
$('app').innerHTML=none?(CANA?`<div class="c"><h2>建立管理員帳號</h2><p class="mu">第一次使用，請先建立管理員帳號與密碼。</p><label>帳號<input id="lu" autocomplete="username"></label><label>密碼（至少 6 碼）<input id="lp" type="password" autocomplete="new-password"></label><label>再輸入一次密碼<input id="lp2" type="password" autocomplete="new-password"></label><button class="btn" onclick="setup()">建立並登入</button></div>`:'<div class="c"><h2>尚未開通</h2><p class="mu">還沒有建立任何帳號，請聯絡管理員。</p></div>'):`<div class="c" style="margin-top:20px"><h2>登入</h2><label>帳號<input id="lu" autocomplete="username"></label><label>密碼<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label><button class="btn" onclick="doLogin()">登入</button></div>`}
async function doLogin(){if(Date.now()<FT0){toast('嘗試次數過多，請稍後再試');return}const u=$('lu').value,p=$('lp').value;if(!u||!p){toast('請輸入帳號與密碼');return}
const id=aid(u),a=ACC[id];let ok=false;if(a)ok=(await hpw(p,a.salt))===a.hash;
if(!ok){if(++FAIL>=5){FT0=Date.now()+30000;FAIL=0}toast('帳號或密碼錯誤');return}FAIL=0;SES=id;try{sessionStorage.setItem('rs',id)}catch(e){}await enter()}
async function enter(){ROLE=ACC[SES].role;await pull();V=ROLE=='admin'?'home':'list';$('nav').style.display='';render()}
function logout(){SES=null;ROLE=null;try{sessionStorage.removeItem('rs')}catch(e){}D={rev:{},exp:[],ven:{}};IMP=null;loginUI()}
async function mkAcc(name,pw,role){name=name.trim();if(!name||pw.length<6){toast('帳號不可空白，密碼至少 6 碼');return false}const id=aid(name);if(ACC[id]){toast('這個帳號已存在');return false}
const salt=rsalt(),a={u:name,salt:salt,hash:await hpw(pw,salt),role:role};try{await DB.doc('accounts/'+id).set(a);ACC[id]=a;return id}catch(e){toast('無法建立：只有 App 擁有者可以管理帳號');return false}}
async function setup(){if($('lp').value!==$('lp2').value){toast('兩次密碼不一致');return}const id=await mkAcc($('lu').value,$('lp').value,'admin');if(id){SES=id;try{sessionStorage.setItem('rs',id)}catch(e){}await enter()}}
async function accAdd(){const id=await mkAcc($('na').value,$('nw').value,$('nr').value);if(id){toast('已新增帳號');render()}}
async function accRole(id,role){if(ACC[id].role=='admin'&&role!='admin'&&Object.values(ACC).filter(a=>a.role=='admin').length<2){toast('至少要保留一位管理員');render();return}try{await DB.doc('accounts/'+id).update({role:role});ACC[id].role=role;if(id==SES)ROLE=role;toast('已更新');render()}catch(e){toast('無法更新')}}
async function accPw(id){const pw=$('np_'+id).value;if(pw.length<6){toast('密碼至少 6 碼');return}const salt=rsalt(),hash=await hpw(pw,salt);try{await DB.doc('accounts/'+id).update({salt:salt,hash:hash});ACC[id].salt=salt;ACC[id].hash=hash;$('np_'+id).value='';toast('密碼已重設')}catch(e){toast('無法重設')}}
async function accDel(id){if(id==SES){toast('不能刪除目前登入的帳號');return}if(ACC[id].role=='admin'&&Object.values(ACC).filter(a=>a.role=='admin').length<2){toast('至少要保留一位管理員');return}try{await DB.doc('accounts/'+id).delete();delete ACC[id];toast('已刪除');render()}catch(e){toast('無法刪除')}}
function acctCard(){const me=ACC[SES]||{};let l=`<div class="c"><h3>帳號管理</h3><p class="mu">目前登入：<b>${esc(me.u)}</b>（${ROLE=='admin'?'管理員':'員工'}）</p><button class="bt2" onclick="logout()">登出</button>`;
if(CANA){l+=Object.entries(ACC).map(([id,a])=>`<div class="c" style="background:var(--bg);box-shadow:none;padding:12px;margin:10px 0 0"><div class="dh" style="border:0;padding:0 0 8px"><b>${esc(a.u)}</b><select data-id="${id}" style="width:auto;margin:0;padding:6px" onchange="accRole(this.dataset.id,this.value)"><option value="admin"${a.role=='admin'?' selected':''}>管理員</option><option value="staff"${a.role!='admin'?' selected':''}>員工</option></select></div><div class="pr"><input id="np_${id}" type="password" placeholder="新密碼（至少 6 碼）" style="margin:0;width:100%"><button class="x" style="color:var(--ac)" data-id="${id}" onclick="accPw(this.dataset.id)">重設</button><button class="x" data-id="${id}" onclick="two(this,()=>accDel(this.dataset.id))">刪除</button></div></div>`).join('')+`<h3 style="margin-top:16px">新增帳號</h3><div class="r2"><label>帳號<input id="na" autocomplete="off"></label><label>密碼（至少 6 碼）<input id="nw" type="password" autocomplete="new-password"></label></div><label>身分<select id="nr"><option value="staff">員工（明細、記帳、廠商）</option><option value="admin">管理員（全部功能）</option></select></label><button class="btn" onclick="accAdd()">新增帳號</button>`}
else l+='<p class="mu">只有 App 擁有者可以新增、刪除帳號或重設密碼。</p>';return l+'</div>'}
function admCards(){const o=admCardsOld();return o.slice(0,o.indexOf('<div class="c"><h3>帳號管理</h3>'))+acctCard()}
boot();
</script></body></html>
