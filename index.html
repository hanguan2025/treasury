const nn=x=>{if(typeof x=='number')return x;const v=parseFloat(String(x).replace(/[,\s$]/g,''));return isFinite(v)?v:null};

function parseWB(wb){const R=[],E=[],nv=new Set();
for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});let hi=-1;
for(let i=0;i<Math.min(rows.length,20);i++){const t=rows[i].map(String);if(t.some(x=>/日期/.test(x))&&t.some(x=>/早|晚|金額|數量|單價/.test(x))){hi=i;break}}
if(hi<0)continue;const M={};rows[hi].forEach((c,j)=>{c=String(c).trim();if(!c)return;const k=/日期/.test(c)?'d':/廠商|供應商/.test(c)?'v':/編號/.test(c)?'c':/單號/.test(c)?'no':/數量/.test(c)?'q':/單價/.test(c)?'p':/金額|小計/.test(c)?'t':/^早/.test(c)?'m':/^晚/.test(c)?'n':/備註/.test(c)?'k':/規格/.test(c)?'s':/^品項|^品名/.test(c)?'i':null;if(k&&M[k]==null)M[k]=j});
if(M.i==null&&M.s!=null){M.i=M.s;M.s=null}
const nm=sn.replace(/^\d{4}[-年]?/,'').trim(),vd=M.v==null?(Object.keys(D.ven).find(k=>k==nm||k.includes(nm)||nm.includes(k))||nm):null,gs=(r,k)=>M[k]!=null?String(r[M[k]]==null?'':r[M[k]]).trim():'';
for(let i=hi+1;i<rows.length;i++){const r=rows[i],d=xd(r[M.d]);if(!d)continue;
if(M.m!=null||M.n!=null){const a=nn(r[M.m]),b=nn(r[M.n]);if(a!=null||b!=null)R.push([d,a||0,b||0,gs(r,'k')])}
else{const q=nn(r[M.q]),p=nn(r[M.p]);let t=nn(r[M.t]);if(t==null&&q!=null&&p!=null)t=q*p;if(!(t>0))continue;const v=M.v!=null?gs(r,'v'):vd;if(!v)continue;if(!D.ven[v])nv.add(v);E.push({d:d,v:v,i:gs(r,'i')||v,q:q==null?'':q,p:p==null?'':p,t:+t.toFixed(2),k:gs(r,'k'),c:gs(r,'c'),s:gs(r,'s'),no:gs(r,'no')})}}}
return{rev:R,exp:E,nv:[...nv]}}

DB=mkDB();CANW=true;try{INIT=(await withTimeout(DB.doc('meta/init').get(),5000)).exists}catch(e){INIT=false}
FB.onAuthStateChanged(FB.auth,async u=>{if(BUSY)return;if(!u){SES=null;ROLE=null;loginUI();return}
try{const a=await withTimeout(DB.doc('accounts/'+u.uid).get(),8000);if(!a.exists){await FB.signOut(FB.auth);loginUI('此帳號尚未開通，請輸入設定碼建立管理員，或聯絡管理員。');return}SES=u.uid;ACC={};ACC[SES]=a.data();await enter()}catch(e){loginUI(emsg(e))}})}
catch(e){$('app').innerHTML='<div class="c"><h2>連線失敗</h2><p class="mu">無法載入 Firebase，請確認網路後重新整理。</p></div>'}}

function loginUI(msg){$('nav').style.display='none';$('hbk').innerHTML='';$('hus').innerHTML='';
const lf=`<div class="c" style="margin-top:20px"><h2>登入</h2><label>帳號<input id="lu" autocomplete="username" autocapitalize="off"></label><label>密碼<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" onchange="$('lp').type=this.checked?'text':'password'">顯示密碼</label><button class="btn" id="lbtn" onclick="doLogin()">登入</button><button class="bt2" onclick="INIT=false;loginUI()">‹ 返回建立管理員帳號</button></div>`,
sf=`<div class="c" style="margin-top:20px"><h2>建立管理員帳號</h2><p class="mu">第一次使用，請輸入「設定碼」，並自行設定管理員的「帳號」與「密碼」（至少6碼）。</p><label>設定碼<input id="lc" type="password" autocomplete="off" placeholder="請輸入後台設定的設定碼"></label><label>帳號（自訂）<input id="lu" autocomplete="off" autocapitalize="off" placeholder="例：boss"></label><label>密碼（自訂，至少 6 碼）<input id="lp" type="password" autocomplete="new-password"></label><label>再輸入一次密碼<input id="lp2" type="password" autocomplete="new-password"></label><button class="btn" id="sbtn" onclick="setup()">建立並登入</button><button class="bt2" onclick="INIT=true;loginUI()">我已經有帳號，改用登入</button></div>`;
$('app').innerHTML=(msg?`<div class="c"><p class="bd">${esc(msg)}</p></div>`:'')+(INIT?lf:sf)}

async function doLogin(){const u=$('lu').value.trim(),p=$('lp').value;if(!u||!p){toast('請輸入帳號與密碼');return}const b=$('lbtn');if(b){b.disabled=true;b.textContent='登入中…'}try{await withTimeout(FB.signIn(FB.auth,em(u),pwn(p)),8000)}catch(e){if(b){b.disabled=false;b.textContent='登入'}toast(emsg(e))}}

async function setup(){
if(BUSY)return;
const u=$('lu').value.trim(),p=pwn($('lp').value),code=$('lc').value.trim();
if(!code){toast('請輸入設定碼');return}
if(!u||p.length<6){toast('帳號不可空白，密碼至少 6 碼');return}
if(p!==pwn($('lp2').value)){toast('兩次密碼不一致');return}
BUSY=true;
const b=$('sbtn');if(b){b.disabled=true;b.textContent='建立中…'}
let made=false;
try{
let c;
try{c=await withTimeout(FB.createUser(FB.auth,em(u),p),8000);made=true}
catch(e){
if(e&&e.code=='auth/email-already-in-use'){
try{c=await withTimeout(FB.signIn(FB.auth,em(u),p),8000)}
catch(x){BUSY=false;if(b){b.disabled=false;b.textContent='建立並登入'}toast('這個帳號名稱已被使用且密碼不同，請換一個帳號名稱（例如 boss）');return}
}else throw e
}
await withTimeout(DB.doc('accounts/'+c.user.uid).set({u:u,role:'admin',code:code}),8000);
await withTimeout(DB.doc('meta/init').set({done:true}),8000);
await withTimeout(DB.doc('accounts/'+c.user.uid).set({u:u,role:'admin'}),8000);
INIT=true;
SES=c.user.uid;ACC={};ACC[SES]={u:u,role:'admin'};
BUSY=false;
await enter();
}catch(e){
if(made)try{await FB.auth.currentUser.delete()}catch(x){}
BUSY=false;
if(b){b.disabled=false;b.textContent='建立並登入'}
toast(/permission-denied/.test((e&&e.code)||'')?'設定碼不正確，或尚未在 Firebase 建立設定碼':emsg(e));
}}

async function loadAcc(){const q=await withTimeout(DB.collection('accounts').get(),8000);ACC={};q.docs.forEach(d=>ACC[d.id]=d.data())}
async function enter(){ROLE=ACC[SES].role;CANA=ROLE=='admin';await pull();if(CANA)await loadAcc();V=CANA?'home':'list';$('nav').style.display='';render()}
async function logout(){try{await FB.signOut(FB.auth)}catch(e){}D={rev:{},exp:[],ven:{}};ACC={};IMP=null;SES=null;ROLE=null}
const nAdm=()=>Object.values(ACC).filter(a=>a.role=='admin').length;
async function accAdd(){const u=$('na').value.trim(),p=pwn($('nw').value),r=$('nr').value;if(!u||p.length<6){toast('帳號不可空白，密碼至少 6 碼');return}
try{SEC=SEC||FB.initializeApp(FB.cfg,'sec');const sa=FB.getAuth(SEC),c=await withTimeout(FB.createUser(sa,em(u),p),8000);await withTimeout(DB.doc('accounts/'+c.user.uid).set({u:u,role:r}),8000);await FB.signOut(sa);await loadAcc();toast('已新增帳號');render()}catch(e){toast(emsg(e))}}
async function accRole(id,role){if(ACC[id].role=='admin'&&role!='admin'&&nAdm()<2){toast('至少要保留一位管理員');render();return}try{await withTimeout(DB.doc('accounts/'+id).update({role:role}),8000);ACC[id].role=role;if(id==SES){ROLE=role;CANA=role=='admin'}toast('已更新');render()}catch(e){toast('無法更新')}}
async function accDel(id){if(id==SES){toast('不能刪除目前登入的帳號');return}if(ACC[id].role=='admin'&&nAdm()<2){toast('至少要保留一位管理員');render();return}try{await withTimeout(DB.doc('accounts/'+id).delete(),8000);delete ACC[id];toast('已移除此帳號的使用權限');render()}catch(e){toast('無法刪除')}}
function acctCard(){const me=ACC[SES]||{};let l=`<div class="c"><h3>帳號管理</h3><p class="mu">目前登入：<b>${esc(me.u)}</b>（${ROLE=='admin'?'管理員':'員工'}）</p><button class="bt2" onclick="go('pw')">修改我的密碼</button><button class="bt2" onclick="logout()">登出</button>`;
l+=Object.entries(ACC).map(([id,a])=>`<div class="c" style="background:var(--bg);box-shadow:none;padding:12px;margin:10px 0 0"><div class="dh" style="border:0;padding:0"><b>${esc(a.u)}</b><span class="pr"><select data-id="${id}" style="width:auto;margin:0;padding:6px" onchange="accRole(this.dataset.id,this.value)"><option value="admin"${a.role=='admin'?' selected':''}>管理員</option><option value="staff"${a.role!='admin'?' selected':''}>員工</option></select><button class="x" data-id="${id}" onclick="two(this,()=>accDel(this.dataset.id))">移除</button></span></div></div>`).join('')+`<h3 style="margin-top:16px">新增帳號</h3><div class="r2"><label>帳號<input id="na" autocomplete="off" autocapitalize="off"></label><label>密碼（至少 6 碼）<input id="nw" type="password" autocomplete="new-password"></label></div><label>身分<select id="nr"><option value="staff">員工（明細、記帳、廠商）</option><option value="admin">管理員（全部功能）</option></select></label><button class="btn" onclick="accAdd()">新增帳號</button><small class="mu">員工忘記密碼時：請到 Firebase 後台 Authentication 刪除該使用者，再回這裡重新新增。</small>`;return l+'</div>'}
function pwView(){return `<div class="c"><h2>修改我的密碼</h2><label>新密碼（至少 6 碼）<input id="pw1" type="password" autocomplete="new-password"></label><label>再輸入一次<input id="pw2" type="password" autocomplete="new-password"></label><button class="btn" onclick="chgPw()">更新密碼</button></div>`}
async function chgPw(){const a=pwn($('pw1').value);if(a.length<6){toast('密碼至少 6 碼');return}if(a!==pwn($('pw2').value)){toast('兩次密碼不一致');return}try{await withTimeout(FB.updatePassword(FB.auth.currentUser,a),8000);toast('密碼已更新');go(ROLE=='admin'?'home':'list')}catch(e){toast(emsg(e))}}
function topbar(){let t='';if(V=='add'&&RET)t='back()';else if(V=='ven'&&VN)t='VN=null;render();scrollTo(0,0)';else if(V=='pw')t="go(ROLE=='admin'?'home':'list')";return t?`<button class="bk" onclick="${t}">‹ 返回</button>`:''}

boot();
</script>
</body></html>
